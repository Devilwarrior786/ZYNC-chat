<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Zync · Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:       #1a1410;
      --ink2:      #4a3f35;
      --ink3:      #8a7a6e;
      --paper:     #faf7f2;
      --paper2:    #f3ede3;
      --paper3:    #ede4d6;
      --rule:      #ddd4c4;
      --ember:     #c94f1e;
      --ember-dim: rgba(201,79,30,0.12);
      --gold:      #b8860b;
      --shadow:    0 1px 3px rgba(26,20,16,0.08), 0 4px 16px rgba(26,20,16,0.06);
      --r:         10px;
      --serif:     'Instrument Serif', Georgia, serif;
      --sans:      'Instrument Sans', system-ui, sans-serif;
      --mono:      'JetBrains Mono', monospace;
    }

    html, body { height: 100%; overflow: hidden; background: var(--paper); color: var(--ink); font-family: var(--sans); }

    /* ═══════════════════════════════════════════════
       LOGIN OVERLAY
    ═══════════════════════════════════════════════ */
    #login {
      position: fixed; inset: 0; z-index: 200;
      background: var(--paper);
      display: flex; align-items: center; justify-content: center;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 27px, var(--rule) 27px, var(--rule) 28px);
    }

    .login-box {
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 20px;
      width: min(440px, 92vw);
      padding: 52px 44px 44px;
      box-shadow: var(--shadow), 0 0 0 6px var(--paper2);
      position: relative;
      animation: boxIn .5s cubic-bezier(.22,.68,0,1.2) both;
    }
    @keyframes boxIn {
      from { opacity:0; transform: scale(.94) translateY(12px); }
      to   { opacity:1; transform: scale(1) translateY(0); }
    }

    .login-stamp {
      position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
      background: var(--ember); color: #fff;
      font-family: var(--mono); font-size: .65rem; font-weight: 500;
      letter-spacing: .14em; text-transform: uppercase;
      padding: 6px 18px; border-radius: 100px;
    }

    .login-wordmark {
      font-family: var(--serif); font-size: 2.8rem;
      color: var(--ink); line-height: 1; margin-bottom: 6px;
      letter-spacing: -.02em;
    }
    .login-wordmark em { color: var(--ember); font-style: italic; }

    .login-sub {
      font-size: .82rem; color: var(--ink3); margin-bottom: 36px;
      font-family: var(--mono);
    }

    .form-row { margin-bottom: 16px; }
    .form-row label {
      display: block; font-size: .7rem; font-weight: 600;
      color: var(--ink2); letter-spacing: .08em; text-transform: uppercase;
      margin-bottom: 7px;
    }
    .form-row input {
      width: 100%;
      background: var(--paper2); border: 1.5px solid var(--rule);
      border-radius: var(--r); padding: 12px 15px;
      font-family: var(--mono); font-size: .88rem; color: var(--ink);
      outline: none; transition: border-color .2s, box-shadow .2s;
    }
    .form-row input:focus {
      border-color: var(--ember);
      box-shadow: 0 0 0 3px var(--ember-dim);
    }
    .form-row input::placeholder { color: var(--ink3); }

    .login-btn {
      width: 100%; margin-top: 8px;
      padding: 14px;
      background: var(--ink); color: var(--paper);
      border: none; border-radius: var(--r);
      font-family: var(--sans); font-size: .92rem; font-weight: 600;
      cursor: pointer; letter-spacing: .01em;
      transition: background .2s, transform .15s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .login-btn:hover { background: var(--ember); transform: translateY(-1px); }
    .login-btn:active { transform: translateY(0); }
    .login-btn svg { width: 16px; height: 16px; fill: currentColor; }

    /* ═══════════════════════════════════════════════
       MAIN LAYOUT
    ═══════════════════════════════════════════════ */
    #app { display: none; height: 100vh; }
    #app.show { display: flex; }

    /* ─ Sidebar ─ */
    .sidebar {
      width: 248px; flex-shrink: 0;
      background: var(--paper2);
      border-right: 1px solid var(--rule);
      display: flex; flex-direction: column;
    }

    .sidebar-top {
      padding: 22px 20px 18px;
      border-bottom: 1px solid var(--rule);
      display: flex; align-items: baseline; gap: 8px;
    }
    .sidebar-brand {
      font-family: var(--serif); font-size: 1.55rem;
      color: var(--ink); letter-spacing: -.02em; line-height: 1;
    }
    .sidebar-brand em { color: var(--ember); font-style: italic; }
    .sidebar-tagline {
      font-family: var(--mono); font-size: .6rem;
      color: var(--ink3); letter-spacing: .06em;
    }

    .sidebar-sect {
      padding: 16px 20px 8px;
      font-family: var(--mono); font-size: .6rem; font-weight: 500;
      color: var(--ink3); letter-spacing: .1em; text-transform: uppercase;
      display: flex; align-items: center; justify-content: space-between;
    }

    .add-room-btn {
      background: none; border: none; cursor: pointer;
      color: var(--ember); font-size: 1.1rem; line-height: 1;
      padding: 0 2px; transition: transform .15s;
    }
    .add-room-btn:hover { transform: scale(1.2); }

    .room-list { flex: 1; overflow-y: auto; padding: 4px 10px; }
    .room-list::-webkit-scrollbar { width: 3px; }
    .room-list::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 2px; }

    .room-item {
      padding: 9px 12px; border-radius: 8px;
      cursor: pointer; transition: background .15s, color .15s;
      display: flex; align-items: center; gap: 8px;
      color: var(--ink2); font-size: .85rem; font-weight: 500;
      user-select: none;
    }
    .room-item:hover { background: var(--paper3); color: var(--ink); }
    .room-item.active { background: var(--ink); color: var(--paper); }
    .room-item .hash { color: var(--ink3); font-family: var(--mono); font-size: .8rem; }
    .room-item.active .hash { color: var(--paper2); }
    .room-item .unread {
      margin-left: auto; background: var(--ember);
      color: #fff; font-size: .6rem; font-family: var(--mono);
      padding: 1px 6px; border-radius: 100px; min-width: 18px; text-align: center;
    }

    .users-panel {
      border-top: 1px solid var(--rule);
      padding: 14px 20px 18px;
    }
    .users-label {
      font-family: var(--mono); font-size: .6rem;
      color: var(--ink3); letter-spacing: .1em; text-transform: uppercase;
      margin-bottom: 10px;
    }
    .user-row {
      display: flex; align-items: center; gap: 9px;
      padding: 5px 0; animation: fadeUp .25s ease;
    }
    .user-av {
      width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--serif); font-size: .7rem; font-weight: 400;
      color: var(--paper); background: var(--ink2);
    }
    .user-av.me { background: var(--ember); }
    .user-name { font-size: .82rem; color: var(--ink2); }
    .user-online {
      width: 6px; height: 6px; border-radius: 50%;
      background: #22c55e; margin-left: auto; flex-shrink: 0;
    }

    /* ─ Chat ─ */
    .chat { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    .chat-header {
      padding: 16px 28px;
      border-bottom: 1px solid var(--rule);
      background: var(--paper);
      display: flex; align-items: center; gap: 14px;
    }
    .chat-room-name {
      font-family: var(--serif); font-size: 1.25rem;
      color: var(--ink); letter-spacing: -.01em;
    }
    .chat-room-name::before { content: '# '; color: var(--ember); font-style: italic; }

    .header-pill {
      background: var(--paper2); border: 1px solid var(--rule);
      border-radius: 100px; padding: 3px 10px;
      font-family: var(--mono); font-size: .65rem; color: var(--ink3);
    }

    #typing-bar {
      margin-left: auto; font-family: var(--mono);
      font-size: .7rem; color: var(--ember);
      opacity: 0; transition: opacity .2s;
      white-space: nowrap; overflow: hidden; max-width: 180px; text-overflow: ellipsis;
    }
    #typing-bar.show { opacity: 1; }

    .messages {
      flex: 1; overflow-y: auto; padding: 20px 28px 12px;
      display: flex; flex-direction: column; gap: 2px;
      background:
        repeating-linear-gradient(180deg, transparent, transparent 27px, var(--rule) 27px, var(--rule) 28px);
      background-attachment: local;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 2px; }

    .day-rule {
      display: flex; align-items: center; gap: 12px;
      margin: 18px 0 10px;
      font-family: var(--mono); font-size: .62rem;
      color: var(--ink3); letter-spacing: .08em; text-transform: uppercase;
    }
    .day-rule::before, .day-rule::after {
      content: ''; flex: 1; height: 1px; background: var(--rule);
    }

    .msg-group { margin-bottom: 2px; }

    .msg {
      display: flex; gap: 12px; align-items: flex-start;
      padding: 4px 8px; border-radius: 8px;
      transition: background .12s;
      animation: fadeUp .2s ease both;
    }
    .msg:hover { background: rgba(26,20,16,.04); }
    .msg.own { flex-direction: row-reverse; }

    .msg-av {
      width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--serif); font-size: .78rem;
      color: var(--paper); background: var(--ink2);
      margin-top: 2px;
    }
    .msg.own .msg-av { background: var(--ember); }

    .msg-inner { max-width: 62%; }
    .msg.own .msg-inner { align-items: flex-end; display: flex; flex-direction: column; }

    .msg-head {
      display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px;
    }
    .msg.own .msg-head { flex-direction: row-reverse; }
    .msg-author {
      font-family: var(--sans); font-size: .78rem; font-weight: 600;
      color: var(--ember);
    }
    .msg-ts {
      font-family: var(--mono); font-size: .63rem; color: var(--ink3);
    }

    .msg-text {
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 3px 12px 12px 12px;
      padding: 9px 14px;
      font-size: .88rem; line-height: 1.6;
      color: var(--ink); word-break: break-word;
      box-shadow: 0 1px 3px rgba(26,20,16,.06);
    }
    .msg.own .msg-text {
      background: var(--ember);
      border-color: var(--ember);
      color: #fff;
      border-radius: 12px 3px 12px 12px;
      box-shadow: 0 2px 8px rgba(201,79,30,.25);
    }

    /* ─ Input ─ */
    .input-dock {
      padding: 14px 28px 18px;
      background: var(--paper);
      border-top: 1px solid var(--rule);
    }

    .input-shell {
      display: flex; align-items: flex-end; gap: 10px;
      background: var(--paper2);
      border: 1.5px solid var(--rule);
      border-radius: 14px;
      padding: 10px 12px;
      transition: border-color .2s, box-shadow .2s;
    }
    .input-shell:focus-within {
      border-color: var(--ember);
      box-shadow: 0 0 0 3px var(--ember-dim);
      background: var(--paper);
    }

    #msg-input {
      flex: 1; background: none; border: none; outline: none;
      font-family: var(--sans); font-size: .9rem; color: var(--ink);
      resize: none; min-height: 24px; max-height: 120px;
      line-height: 1.55; padding: 2px 0;
    }
    #msg-input::placeholder { color: var(--ink3); }

    .send-btn {
      width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
      background: var(--ink); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s, transform .15s;
    }
    .send-btn:hover { background: var(--ember); transform: translateY(-1px); }
    .send-btn:active { transform: translateY(0); }
    .send-btn svg { width: 15px; height: 15px; fill: var(--paper); }

    /* ─ New Room modal ─ */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 300;
      background: rgba(26,20,16,.45); backdrop-filter: blur(2px);
      display: none; align-items: center; justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--paper); border: 1px solid var(--rule);
      border-radius: 16px; padding: 32px 28px 24px;
      width: min(360px, 90vw); box-shadow: var(--shadow);
      animation: boxIn .3s cubic-bezier(.22,.68,0,1.2) both;
    }
    .modal h3 {
      font-family: var(--serif); font-size: 1.3rem; margin-bottom: 16px;
    }
    .modal input {
      width: 100%; background: var(--paper2); border: 1.5px solid var(--rule);
      border-radius: var(--r); padding: 11px 14px;
      font-family: var(--mono); font-size: .88rem; color: var(--ink);
      outline: none; margin-bottom: 14px; transition: border-color .2s, box-shadow .2s;
    }
    .modal input:focus { border-color: var(--ember); box-shadow: 0 0 0 3px var(--ember-dim); }
    .modal-btns { display: flex; gap: 10px; justify-content: flex-end; }
    .modal-btns button {
      padding: 9px 20px; border-radius: 8px; border: none;
      font-family: var(--sans); font-size: .85rem; font-weight: 600;
      cursor: pointer; transition: background .15s;
    }
    .btn-cancel { background: var(--paper2); color: var(--ink2); }
    .btn-cancel:hover { background: var(--paper3); }
    .btn-create { background: var(--ink); color: var(--paper); }
    .btn-create:hover { background: var(--ember); }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(6px); }
      to   { opacity:1; transform:translateY(0); }
    }
  </style>
</head>
<body>

<!-- ══════════════ LOGIN ══════════════ -->
<div id="login">
  <div class="login-box">
    <div class="login-stamp">Real-time Chat</div>
    <div class="login-wordmark">Zy<em>nc</em></div>
    <div class="login-sub">// connect · sync · vibe</div>

    <div class="form-row">
      <label>Your handle</label>
      <input id="un" type="text" placeholder="e.g. alex_k" autocomplete="off" maxlength="24"/>
    </div>
    <div class="form-row">
      <label>Room to join</label>
      <input id="rm" type="text" placeholder="general" autocomplete="off" maxlength="32" value="general"/>
    </div>
    <button class="login-btn" onclick="doLogin()">
      Enter Zync
      <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </button>
  </div>
</div>

<!-- ══════════════ APP ══════════════ -->
<div id="app">
  <aside class="sidebar">
    <div class="sidebar-top">
      <span class="sidebar-brand">Zy<em>nc</em></span>
      <span class="sidebar-tagline">// chat</span>
    </div>

    <div class="sidebar-sect">
      Rooms
      <button class="add-room-btn" title="New room" onclick="openModal()">＋</button>
    </div>
    <div class="room-list" id="room-list"></div>

    <div class="users-panel">
      <div class="users-label">Online</div>
      <div id="user-list"></div>
    </div>
  </aside>

  <main class="chat">
    <div class="chat-header">
      <span class="chat-room-name" id="hdr-room">general</span>
      <span class="header-pill" id="hdr-count">0 online</span>
      <span id="typing-bar"></span>
    </div>

    <div class="messages" id="messages">
      <div class="day-rule">Today</div>
    </div>

    <div class="input-dock">
      <div class="input-shell">
        <textarea id="msg-input" placeholder="Message #general…" rows="1"></textarea>
        <button class="send-btn" onclick="sendMsg()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round" style="fill:none">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>
  </main>
</div>

<!-- ══════════════ NEW ROOM MODAL ══════════════ -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3>Create a room</h3>
    <input id="new-room-input" type="text" placeholder="e.g. design-talk" maxlength="32"/>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-create" onclick="createRoom()">Create & Join</button>
    </div>
  </div>
</div>

<script>
  const socket = io();
  let me = '', myRoom = 'general';
  let typingTimeout;

  // ─ Login ─────────────────────────────────────────────────────
  function doLogin() {
    const un = document.getElementById('un').value.trim();
    const rm = document.getElementById('rm').value.trim() || 'general';
    if (!un) { document.getElementById('un').focus(); return; }
    me = un; myRoom = rm;

    document.getElementById('login').style.display = 'none';
    document.getElementById('app').classList.add('show');

    socket.emit('join', { username: me, room: myRoom });
    socket.emit('get_rooms');

    setRoom(myRoom);
    document.getElementById('msg-input').focus();
  }

  document.getElementById('un').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('rm').focus();
  });
  document.getElementById('rm').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });

  // ─ Room helpers ──────────────────────────────────────────────
  function setRoom(room) {
    myRoom = room;
    document.getElementById('hdr-room').textContent = room;
    document.getElementById('msg-input').placeholder = `Message #${room}…`;
    document.querySelectorAll('.room-item').forEach(el =>
      el.classList.toggle('active', el.dataset.room === room));
  }

  function switchRoom(room) {
    if (room === myRoom) return;
    document.getElementById('messages').innerHTML = '<div class="day-rule">Today</div>';
    socket.emit('join', { username: me, room: room });
    setRoom(room);
  }

  // ─ Modal ─────────────────────────────────────────────────────
  function openModal() { document.getElementById('modal').classList.add('show'); document.getElementById('new-room-input').focus(); }
  function closeModal() { document.getElementById('modal').classList.remove('show'); document.getElementById('new-room-input').value = ''; }
  function createRoom() {
    const r = document.getElementById('new-room-input').value.trim().toLowerCase().replace(/\s+/g,'-');
    if (!r) return;
    closeModal();
    switchRoom(r);
    socket.emit('join', { username: me, room: r });
  }
  document.getElementById('new-room-input').addEventListener('keydown', e => { if (e.key === 'Enter') createRoom(); });
  document.getElementById('modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

  // ─ Send ──────────────────────────────────────────────────────
  function sendMsg() {
    const inp = document.getElementById('msg-input');
    const text = inp.value.trim();
    if (!text) return;
    inp.value = ''; inp.style.height = 'auto';
    socket.emit('message', { username: me, message: text, room: myRoom });
  }

  const msgInput = document.getElementById('msg-input');
  msgInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
  });
  msgInput.addEventListener('input', () => {
    msgInput.style.height = 'auto';
    msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
    socket.emit('typing', { username: me, room: myRoom });
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => {}, 1500);
  });

  // ─ Render helpers ────────────────────────────────────────────
  function initials(name) { return name.slice(0, 2).toUpperCase(); }
  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function appendMsg(username, message, time, noAnim) {
    const box = document.getElementById('messages');
    const isMe = username === me;
    const div = document.createElement('div');
    div.className = `msg${isMe ? ' own' : ''}`;
    if (noAnim) div.style.animation = 'none';
    div.innerHTML = `
      <div class="msg-av${isMe ? ' me' : ''}">${initials(username)}</div>
      <div class="msg-inner">
        <div class="msg-head">
          <span class="msg-author">${esc(username)}</span>
          <span class="msg-ts">${esc(time)}</span>
        </div>
        <div class="msg-text">${esc(message)}</div>
      </div>`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  // ─ Socket events ─────────────────────────────────────────────
  socket.on('message', d => appendMsg(d.username, d.message, d.time, false));

  socket.on('load_messages', msgs => {
    const box = document.getElementById('messages');
    box.innerHTML = '<div class="day-rule">Today</div>';
    msgs.forEach(m => appendMsg(m.username, m.message, m.time, true));
  });

  socket.on('room_list', rooms => {
    const el = document.getElementById('room-list');
    el.innerHTML = '';
    rooms.forEach(r => {
      const d = document.createElement('div');
      d.className = `room-item${r === myRoom ? ' active' : ''}`;
      d.dataset.room = r;
      d.innerHTML = `<span class="hash">#</span>${esc(r)}`;
      d.onclick = () => switchRoom(r);
      el.appendChild(d);
    });
  });

  socket.on('user_list', users => {
    const el = document.getElementById('user-list');
    el.innerHTML = '';
    users.forEach(u => {
      const d = document.createElement('div');
      d.className = 'user-row';
      d.innerHTML = `
        <div class="user-av${u === me ? ' me' : ''}">${initials(u)}</div>
        <span class="user-name">${esc(u)}</span>
        <div class="user-online"></div>`;
      el.appendChild(d);
    });
    document.getElementById('hdr-count').textContent = `${users.length} online`;
  });

  socket.on('typing', d => {
    const bar = document.getElementById('typing-bar');
    bar.textContent = `${d.username} is typing…`;
    bar.classList.add('show');
    clearTimeout(window._tc);
    window._tc = setTimeout(() => bar.classList.remove('show'), 2000);
  });
</script>
</body>
</html>
